# Copy to docker-compose.override.yml (gitignored) for local / beta VM.
# Do NOT bind-mount ./backend — use image rebuild after code changes.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   # ensure backend/.env has GOOGLE_CLOUD_PROJECT + Vertex settings
#   docker compose up -d --build backend
#
services:
  backend:
    env_file:
      - backend/.env
    volumes:
      - ./.asep:/.asep:ro
      - ./knowledge/thesis-agent:/knowledge/thesis-agent:ro
      - document_data:/data/documents
    environment:
      # Compose network + container paths override host-relative .env values
      DATABASE_URL: postgresql+psycopg://thesisos:thesisos@db:5432/thesisos
      THESIS_AGENT_KNOWLEDGE_ROOT: /knowledge/thesis-agent
      DOCUMENT_STORAGE_LOCAL_DIR: /data/documents
