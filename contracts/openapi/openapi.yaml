openapi: 3.1.0
info: { title: ThesisOS API, version: 0.0.0 }
paths:
  # ---------------------------------------------------------------------------
  # Implemented in M0
  # ---------------------------------------------------------------------------
  /health:
    get:
      summary: Liveness
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } } }
  /ready:
    get:
      summary: Readiness (db + config)
      responses:
        "200": { description: ready, content: { application/json: { schema: { $ref: "#/components/schemas/Ready" } } } }
        "503": { description: not ready }
  /metrics:
    get: { summary: Prometheus metrics, responses: { "200": { description: OK } } }
  /jobs:
    post:
      summary: Enqueue a background job (contract only in M0)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/JobCreate" } } } }
      responses: { "202": { description: accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } } }
  /jobs/{id}:
    get:
      summary: Job status
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } } }

  # ---------------------------------------------------------------------------
  # Deferred (contract-only stubs declared now, implemented in later milestones)
  # ---------------------------------------------------------------------------
  /chat:
    post:
      summary: Chat with the assistant (SSE token stream)
      x-milestone: M1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
                conversation_id: { type: string }
              required: [message]
      responses:
        "200":
          description: Server-Sent Events stream (events token, ping, done, error)
          content:
            text/event-stream: {}
        "409": { description: A response is already streaming for this conversation }
        "503": { description: LLM runtime not configured }
  /upload:
    post:
      summary: Upload a document (PDF/EPUB/DOCX); parsing runs asynchronously
      x-milestone: M3
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string, nullable: true }
                author: { type: string, nullable: true }
                language: { type: string, nullable: true }
      responses:
        "201": { description: Created (status uploaded; parse runs async), content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "400": { description: Unsupported format, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /documents:
    get:
      summary: List documents (q is an ILIKE filter on title/filename only — not search)
      x-milestone: M3
      parameters:
        - { name: source_type, in: query, required: false, schema: { type: string, enum: [pdf, epub, docx] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [uploaded, processing, parsed, failed] } }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Case-insensitive substring on title/filename (not corpus search)" }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Document" } } } } }
  /documents/{id}:
    get:
      summary: Get a document
      x-milestone: M3
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      summary: Update document metadata (optimistic lock)
      x-milestone: M3
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUpdate" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: write_conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Delete a document (cascades chunks, versions, original bytes)
      x-milestone: M3
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /documents/{id}/chunks:
    get:
      summary: List a document's chunks, ordered by chunk_index (unranked, document-scoped)
      x-milestone: M3
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DocumentChunk" } } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /documents/{id}/versions:
    get:
      summary: List document version history (read-only)
      x-milestone: M3
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DocumentVersion" } } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /documents/{id}/reparse:
    post:
      summary: Re-parse a document from its stored original (async)
      x-milestone: M3
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Accepted (parse runs async) }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /search:
    post:
      summary: Search the corpus
      x-milestone: M4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Embedding failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /summarize:
    post:
      summary: Summarize a document
      x-milestone: M3
      responses:
        "501": { description: not implemented yet }
  /outline:
    get:
      summary: Get the thesis outline
      x-milestone: M8
      responses:
        "501": { description: not implemented yet }
  /chapters:
    get:
      summary: List chapters (structural, not retrieval)
      x-milestone: M6
      parameters:
        - { name: parent_id, in: query, required: false, schema: { type: string, format: uuid }, description: "Filter by parent chapter (sections)" }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Case-insensitive substring filter on title (not semantic search)" }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Chapter" } }
    post:
      summary: Create a chapter
      x-milestone: M6
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChapterCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        "422": { description: Invalid status, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /chapters/{id}:
    get:
      summary: Get chapter by id (includes content_md — workspace editor surface)
      x-milestone: M6
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Chapter" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      summary: Update chapter content and/or metadata (optimistic lock)
      x-milestone: M6
      description: "content_md present → content edit; otherwise a metadata/status edit. expected_version required."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChapterUpdate" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Chapter" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: write_conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: Invalid status / missing expected_version, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /chapters/{id}/versions:
    get:
      summary: List chapter change-stream history (read-only)
      x-milestone: M6
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChapterVersion" } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /memory:
    get:
      summary: List memories
      x-milestone: M2
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [user, thesis, concept, citation, decision, editable] } }
        - { name: key, in: query, required: false, schema: { type: string } }
        - { name: pinned, in: query, required: false, schema: { type: boolean } }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Case-insensitive substring filter (not semantic search)" }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Memory" } }
    post:
      summary: Create memory
      x-milestone: M2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "409": { description: Singleton already exists, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: Invalid kind, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /memory/{id}:
    get:
      summary: Get memory by id
      x-milestone: M2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Memory" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      summary: Update memory (optimistic lock)
      x-milestone: M2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryUpdate" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Memory" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: write_conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Delete memory
      x-milestone: M2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "400": { description: Cannot delete singleton, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /memory/{id}/versions:
    get:
      summary: List memory version history (read-only)
      x-milestone: M2
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MemoryVersion" } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /citations/validate:
    post:
      summary: Validate citation markers in chapter text (PX6)
      x-milestone: M7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                sources: { type: array, items: { type: object } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues: { type: array, items: { type: object } }
                  blocking: { type: boolean }
                required: [issues, blocking]
  /conversations:
    get:
      summary: List conversations for a project
      x-milestone: M7
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        project_id: { type: string }
                        title: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                      required: [id, project_id, created_at]
                required: [items]
    post:
      summary: Create a conversation thread
      x-milestone: M7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
                title: { type: string, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  project_id: { type: string }
                  title: { type: string, nullable: true }
                  created_at: { type: string, format: date-time }
                required: [id, project_id, created_at]
  /conversations/{conversation_id}/messages:
    get:
      summary: List persisted messages for a conversation
      x-milestone: M7
      parameters:
        - { name: conversation_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        role: { type: string }
                        content: { type: string }
                        created_at: { type: string, format: date-time }
                      required: [id, role, content, created_at]
                required: [items]
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /proposals:
    get:
      summary: List writing proposals
      x-milestone: M7
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string } }
        - { name: chapter_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
    post:
      summary: Create a writing proposal
      x-milestone: M7
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object } } } }
  /proposals/{proposal_id}/accept:
    post:
      summary: Accept proposal and apply to chapter
      x-milestone: M7
      parameters:
        - { name: proposal_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_chapter_version: { type: integer }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /proposals/{proposal_id}/reject:
    post:
      summary: Reject a pending proposal
      x-milestone: M7
      parameters:
        - { name: proposal_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /export/chapters/{chapter_id}.md:
    get:
      summary: Download chapter as Markdown attachment
      x-milestone: M7
      parameters:
        - { name: chapter_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Markdown file
          content:
            text/markdown:
              schema: { type: string }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /projects/{project_id}/context:
    get:
      summary: Context packet for a UI surface
      x-milestone: M7
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
        - { name: surface, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /projects/{project_id}/sources:
    get:
      summary: List DB-backed sources for a project
      x-milestone: M7
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: include_deprecated, in: query, required: false, schema: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /projects/{project_id}/sources/{slug}:
    get:
      summary: Get source detail by slug
      x-milestone: M7
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /projects/{project_id}/sources/bibliography/export:
    get:
      summary: Export approved sources as BibTeX (DB-backed)
      x-milestone: M7
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [bibtex], default: bibtex } }
      responses:
        "200":
          description: BibTeX attachment
          content:
            application/x-bibtex:
              schema: { type: string }
  /citations:
    post:
      summary: Create citations (deferred)
      x-milestone: M7
      deprecated: true
      responses:
        "501": { description: not implemented yet }
  /bibliography:
    get:
      summary: Legacy bibliography stub — use /projects/{project_id}/sources/bibliography/export
      x-milestone: M7
      deprecated: true
      parameters:
        - { name: style, in: query, required: false, schema: { type: string }, description: "Citation style, e.g. apa7" }
      responses:
        "501": { description: not implemented — use bibliography/export path }

components:
  schemas:
    Health: { type: object, properties: { status: { type: string, enum: [ok] } }, required: [status] }
    Ready:
      type: object
      properties: { status: { type: string }, db: { type: boolean }, config: { type: boolean } }
      required: [status, db, config]
    JobCreate:
      type: object
      properties: { type: { type: string }, payload: { type: object } }
      required: [type]
    Job:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        status: { type: string, enum: [pending, in_progress, done, error] }
      required: [id, type, status]
    Error:
      type: object
      properties: { code: { type: string }, message: { type: string } }
      required: [code, message]
    Memory:
      type: object
      required: [id, kind, content, metadata, pinned, source, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [user, thesis, concept, citation, decision, editable] }
        title: { type: string, nullable: true }
        content: { type: string }
        metadata: { type: object }
        key: { type: string, nullable: true }
        pinned: { type: boolean }
        source: { type: string, enum: [user, system, agent] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemoryCreate:
      type: object
      required: [kind, content]
      properties:
        kind: { type: string, enum: [user, thesis, concept, citation, decision, editable] }
        title: { type: string, nullable: true }
        content: { type: string }
        metadata: { type: object }
        key: { type: string, nullable: true }
        pinned: { type: boolean, default: false }
        source: { type: string, enum: [user, system, agent], default: user }
    MemoryUpdate:
      type: object
      required: [expected_version]
      properties:
        title: { type: string, nullable: true }
        content: { type: string, nullable: true }
        metadata: { type: object, nullable: true }
        pinned: { type: boolean, nullable: true }
        expected_version: { type: integer, minimum: 1 }
    MemoryVersion:
      type: object
      required: [memory_id, version, content, source, changed_at]
      properties:
        memory_id: { type: string, format: uuid }
        version: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        metadata: { type: object }
        source: { type: string }
        changed_at: { type: string, format: date-time }
    Chapter:
      type: object
      required: [id, order_index, title, status, word_count, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        order_index: { type: integer }
        title: { type: string }
        status: { type: string, enum: [draft, review, approved, published] }
        content_md: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        word_count: { type: integer }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChapterCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        order_index: { type: integer, default: 0 }
