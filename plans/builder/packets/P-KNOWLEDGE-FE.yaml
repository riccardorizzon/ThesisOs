id: P-KNOWLEDGE-FE
wave: 2
agent_type: implementer
track: product
domain: knowledge

objective: >-
  Wire Knowledge explorer to real API; remove stubConcepts from happy path;
  explicit error when API unavailable.

depends_on:
  - P-KNOWLEDGE-DB

owned_files:
  - frontend/app/knowledge/
  - frontend/components/knowledge/
  - frontend/lib/knowledgeClient.ts

do_not_touch:
  - frontend/app/sources/
  - frontend/app/writing/
  - frontend/app/review/
  - backend/

required_checks:
  - cmd: cd frontend && npx tsc --noEmit
    expect: pass
  - cmd: cd frontend && npm run test -- --run KnowledgeExplorer
    expect: pass

definition_of_done:
  tests_green: true
  api_documented: n/a
  ui_wired: true
  no_silent_fallback: true
  no_stub_happy_path: true
  screenshot: "Knowledge list or empty state"
  reviewer_approved: true
  ci_after_merge: true

done_criteria:
  - "No stubConcepts() on happy path"
  - "Empty DB shows empty state UI"
