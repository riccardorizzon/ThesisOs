id: P-REVIEW-FE
wave: 2
agent_type: implementer
track: product
domain: review

objective: >-
  Review domain: wire proposalClient to API; accept/reject persists;
  remove in-memory-only queue as primary store.

depends_on:
  - P-REVIEW-PERSIST-BE

owned_files:
  - frontend/app/review/
  - frontend/components/review/
  - frontend/lib/proposalClient.ts
  - frontend/lib/proposalQueue.ts

do_not_touch:
  - frontend/app/sources/
  - frontend/app/knowledge/
  - frontend/app/writing/
  - frontend/app/ai/
  - backend/

required_checks:
  - cmd: cd frontend && npx tsc --noEmit
    expect: pass
  - cmd: cd frontend && npm run test -- --run Review
    expect: pass

definition_of_done:
  tests_green: true
  api_documented: n/a
  ui_wired: true
  no_silent_fallback: true
  no_stub_happy_path: true
  screenshot: "Review accept updates chapter"
  reviewer_approved: true
  ci_after_merge: true

done_criteria:
  - "Accept proposal persists via API"
  - "Refresh shows accepted content in Writing"
