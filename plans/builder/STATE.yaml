# Builder orchestration STATE — M3 Document System, Phase 4 (Admin UI).
# Validate: .cursor/skills/orchestrate-builders/scripts/validate-state.sh
#
# Phases 1–3 (DB, DocumentService, REST API) are committed and green under
# `make ci`. This epic drives Phase 4 (Document Administration UI) — frontend
# only, so it is validatable in CI without Postgres/Docker.
# Source of truth: plans/m3-document-system-plan.md §Phase 4 + the M3 frozen spec.

epic: m3-document-system-phase4
chain: m3-ui-001
status: closed   # active | closed — Phase 4 Admin UI complete; make ci green (frontend 33 passed)
wave: 2

# Frozen constraints — every builder MUST respect (M3 spec §11, §13; plan Phase 4)
decisions:
  - "Mirror the Memory Administration UI pattern (client/store/components/pages)"
  - "Admin tooling ONLY — no PDF reader, no notebook, no chat sidebar, no summarize button"
  - "NO corpus search box; chunk list is document-scoped, unranked, verification-only"
  - "Chunk preview truncated (~200 chars); status badge shows uploaded|processing|parsed|failed (no 'indexed')"
  - "Frontend gate = `make ci` (tsc --noEmit + vitest + build); no DB needed"
  - "Contracts additive only; backend frozen (DocumentService + /documents API from Phase 2/3)"

# Active file ownership during a wave (path prefix → packet id). Empty between waves.
file_locks: {}

# Open blockers (packet id → description)
blockers: {}

packets:
  P-CLIENT:
    wave: 1
    agent_type: implementer
    status: done
    depends_on: []
    owned_files:
      - frontend/lib/documentClient.ts
      - frontend/lib/documentStore.ts
    output: "documentClient (list/get/upload/update/delete/listChunks/listVersions/reparse + DocumentApiError) and zustand documentStore mirroring memoryStore."
    checks: []
    integration_notes: "Multipart upload via FormData; reparse returns 202."

  P-COMP:
    wave: 1
    agent_type: implementer
    status: done
    depends_on: []
    owned_files:
      - frontend/components/DocumentList.tsx
      - frontend/components/DocumentStatusBadge.tsx
      - frontend/components/DocumentForm.tsx
      - frontend/components/DocumentChunkList.tsx
      - frontend/components/DocumentVersionList.tsx
      - frontend/components/DocumentErrorBanner.tsx
    output: "Six presentational components mirroring Memory admin; status badge colors per lifecycle; chunk preview truncated."
    checks: []
    integration_notes: "No search box on chunk list (Critic Phase 4 guardrail)."

  P-PAGES:
    wave: 2
    agent_type: implementer
    status: done
    depends_on: [P-CLIENT, P-COMP]
    owned_files:
      - frontend/app/documents/page.tsx
      - frontend/app/documents/upload/page.tsx
      - frontend/app/documents/[id]/page.tsx
      - frontend/app/documents/[id]/chunks/page.tsx
    output: "List (filters q/status/source_type), upload (file + metadata), detail (edit/reparse/delete/versions), chunks preview."
    checks: []
    integration_notes: "Upload redirects to detail; reparse triggers async parse."

  P-TESTS:
    wave: 2
    agent_type: implementer
    status: done
    depends_on: [P-CLIENT, P-COMP]
    owned_files:
      - frontend/lib/documentClient.test.ts
      - frontend/lib/documentStore.test.ts
      - frontend/components/DocumentList.test.tsx
      - frontend/components/DocumentStatusBadge.test.tsx
      - frontend/components/DocumentChunkList.test.tsx
    output: "Vitest: client param/error mapping + upload FormData; store fetch flows; component render + truncation + no-search guard."
    checks: []
    integration_notes: "Runs in CI (jsdom), no DB."
