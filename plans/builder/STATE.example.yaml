# Builder orchestration STATE — copy to STATE.yaml and customize per epic.
# Validate: .cursor/skills/orchestrate-builders/scripts/validate-state.sh

epic: m1-conversation-system
chain: m1-conv-001
status: active  # active | closed
wave: 1

# Frozen constraints — every agent MUST respect (from plan anti-goals + ADRs)
decisions:
  - "GraphState frozen (ADR-0007) — no new fields without ADR"
  - "RunContext separate from GraphState (ADR-0014)"
  - "TokenChunk frozen: text, finish_reason, metadata (ADR-0011)"
  - "M1 scope: chat loop only — no agents, RAG, tools, ingestion"

# Active file ownership during a wave (path prefix → packet id)
file_locks: {}

# Open blockers (packet id → description)
blockers: {}

packets:
  P1:
    wave: 1
    agent_type: explorer
    status: ready  # ready | in_progress | done | blocked | cancelled
    depends_on: []
    owned_files:
      - backend/app/llm/
    output: null
    checks: []
    integration_notes: null

  P2:
    wave: 1
    agent_type: explorer
    status: ready
    depends_on: []
