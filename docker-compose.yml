services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: thesisos
      POSTGRES_PASSWORD: thesisos
      POSTGRES_DB: thesisos
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesisos"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://thesisos:thesisos@db:5432/thesisos
      APP_ENV: local
      DOCUMENT_STORAGE_LOCAL_DIR: /data/documents
      # ADR-0048 — empty default (local DX); set for public cohort tunnel
      BETA_ACCESS_TOKEN: ${BETA_ACCESS_TOKEN:-}
    volumes:
      - ./.asep:/.asep:ro
      - document_data:/data/documents
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        INTERNAL_API_BASE_URL: http://backend:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      INTERNAL_API_BASE_URL: http://backend:8000
      BETA_ACCESS_TOKEN: ${BETA_ACCESS_TOKEN:-}
      NEXT_PUBLIC_BETA_ACCESS_TOKEN: ${BETA_ACCESS_TOKEN:-}
    depends_on:
      backend: { condition: service_healthy }
    ports: ["3000:3000"]
  # Preferred compose entrypoint: same-origin UI + unbuffered SSE (/api → backend).
  # Default host port 8088 (8080 often used by host nginx / beta-public tunnel).
  # Open http://localhost:8088 — not :3000 — for stable chat/writing streams.
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
    ports: ["${NGINX_HOST_PORT:-8088}:80"]
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  pgdata: {}
  document_data: {}
