  PX2-EWO-001: [frontend/components/context/**, backend/app/services/context/**, backend/app/api/projects.py, backend/app/schemas/context.py]
  PX2-EWO-002: [frontend/components/writing/MarkdownEditor.tsx, frontend/components/writing/WritingEditorShell.tsx, frontend/components/writing/WritingOutline.tsx, frontend/components/writing/WritingWorkspace.tsx, frontend/components/ui/StatusBadge.tsx, frontend/lib/chapterClient.ts, frontend/app/writing/**]
  PX2-EWO-003: [frontend/components/writing/RightRail.tsx, frontend/components/writing/RailTabs.tsx, frontend/components/writing/WritingAiPanel.tsx]
  PX2-EWO-004: [frontend/components/sources/**, frontend/lib/corpusClient.ts]
  PX2-EWO-005: [frontend/components/decisions/**, frontend/components/context/DecisionBadge.tsx, frontend/lib/decisionClient.ts]
  PX2-EWO-006: [frontend/components/chrome/SessionChip.tsx, frontend/components/memory/ProposalBundleModal.tsx, frontend/lib/sessionState.ts]
  PX2-EWO-007: [frontend/components/review/ReviewCompare.tsx, frontend/app/review/**]
  PX2-EWO-008: [frontend/components/chrome/CommandPalette.tsx, frontend/components/onboarding/**, frontend/hooks/useKeyboardShortcuts.ts]

