    - frontend/app/**/conformance/**
  PX3-EWO-009:
    - frontend/components/knowledge/graph/**
    - frontend/app/knowledge/graph/**
    - backend/app/api/knowledge.py
    - backend/app/services/knowledge/**
  PX3-EWO-010:
    - supervisor_only
