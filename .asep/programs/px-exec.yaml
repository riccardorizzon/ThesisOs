# ─────────────────────────────────────────────────────────────────────────────
# Phases — specification deliverables first; implementation gated per phase
# ─────────────────────────────────────────────────────────────────────────────

phases:

  phase_1:
    id: PX-EXEC-P1
    title: Runtime Foundation
    status: complete
    wave: wave_a
    goal: >-
      Freeze and implement the Runtime core: event bus, rule engine, dependency
      engine, job queue, scheduler, state projection. No product impact.
    capabilities:
      - px-exec-1-event-model
      - px-exec-2-rule-engine
      - px-exec-3-dependency-engine
      - px-exec-4-job-queue
      - px-exec-5-scheduler
      - px-exec-6-state-projection
    specification_deliverables:
      - docs/platform/runtime-model-v2.md
      - decisions/ADR-0042-engineering-runtime.md
      - docs/superpowers/specs/mb2-engineering-runtime-spec.md
    implementation_gate: MB2-Q1-pass
    acceptance:
      - Event catalog extended; append-only bus operational
      - Rule engine evaluates declarative rules from YAML
      - Program Graph → Execution Graph derivation tested
      - Job FSM transitions match ADR-0025 + L2 GSM
      - Projection document rebuildable from event log
      - make unit-builder-engine green + new MB2 test suite
    does_not_include:
      - Merge automation
      - Integration review automation
      - QWO auto-trigger
      - Dashboard UI

  phase_2:
    id: PX-EXEC-P2
    title: Execution Plugins
    status: dispatch_authorized
    depends_on_phase: phase_1
    goal: >-
      Register Merge, Integration, and Qualification engines as plugins driven by
      rules — replacing manual orchestrate-builders steps for wave lifecycle.
    capabilities:
      - px-exec-7-merge-plugin
      - px-exec-8-integration-plugin
      - px-exec-9-qualification-plugin
    specification_deliverables:
      - Plugin interface contracts in mb2 spec
      - Rule packs for px2-parallel replay (golden path)
    implementation_gate: MB2-Q4-pass
    acceptance:
      - PX-2 parallel program replayable via Runtime (dry-run then live)
      - Merge order enforced by Dependency Engine + MergePlugin
      - Integration review spawned on MergeCompleted + CI green
      - QWO spawn on IntegrationPassed + coverage gate
      - Supervisor escalates on plugin failure → WAIT

  phase_3:
    id: PX-EXEC-P3
    title: Observability
    status: planned
    depends_on_phase: phase_2
    goal: >-
      Program Dashboard and metrics as read-only projections. No duplicated logic.
    capabilities:
      - px-exec-10-dashboard-projection
      - px-exec-11-metrics-plugin
      - px-exec-12-notification-plugin
    specification_deliverables:
      - Projection schema v1 (YAML/JSON)
      - Dashboard UX spec (view only)
    implementation_gate: MB2-Q5-pass
    acceptance:
      - Single projection file reflects wave/integration/qwo status
      - CLI `builder-engine status` reads projection only
      - Optional web dashboard reads projection API — zero scheduling logic in UI

  phase_4:
    id: PX-EXEC-P4
    title: Provider Abstraction & Scale
    status: planned
    depends_on_phase: phase_3
    goal: >-
      AgentProvider interface, multi-program queue, recovery and retry policies.
    capabilities:
      - px-exec-13-agent-provider
      - px-exec-14-multi-program
      - px-exec-15-recovery-policies
    specification_deliverables:
      - AgentProvider protocol + Cursor adapter spec
      - Multi-program concurrency rules
    implementation_gate: MB2-Q6-pass
    acceptance:
      - Second AgentProvider stub passes contract tests
      - Two programs (e.g. px3-parallel + px-exec) schedulable without cross-contamination
      - FAILED → READY recovery transition with audit event

