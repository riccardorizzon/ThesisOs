# Capability Graph — ThesisOS Runtime Platform
#
# The ASEP skill reasons over CAPABILITIES, not milestone numbers. A request like
# "implementa l'Event Bus" resolves to a node here; the node carries deps,
# required ADRs, baseline, tests, and promotion target.
#
# Source-of-truth note: the PLAN remains authoritative for exact scope —
# plans/m5-tool-router-plan.md for the M5 Runtime Platform nodes, and
# plans/m6-writing-workspace-plan.md for the M6 Writing Workspace nodes. This
# graph is the navigation layer (what is ready, what it depends on, what it
# needs). Phases map nodes to plan sections.

platform: Runtime Platform

governance:
  constitution: docs/runtime-constitution.md
  layer_rules: decisions/ADR-0030-agent-runtime-layer-boundaries.md
  contract: docs/runtime-contract.md
  checklist: docs/architecture-decision-checklist.md
  plan: plans/m6-writing-workspace-plan.md   # active milestone (M6); M5 plan frozen/historical

# status: done | ready | planned | blocked
capabilities:

  event-contract:
    title: Runtime Event Contract
    aliases: [event contract, runtime event model, event vocabulary]
    phase: M5.4A
    status: done
    baseline: "0339643"
    depends_on: []
    requires: [runtime-constitution, ADR-0030]
    artifacts: [backend/app/runtime/events.py, backend/app/runtime/contracts.py]
    tests: [make ci, make unit-m4-recovery]

  event-bus:
    title: Runtime Event Bus
    aliases: [event bus, runtime bus, dispatch]
    phase: M5.4B
    status: done
    baseline: "520d3bb"
    depends_on: [event-contract]
    requires: [runtime-constitution, ADR-0030]
    invariant: >-
      Event Bus depends only on RuntimeSubscriber / RuntimeEventEmitter; it must
      not import any concrete subscriber; a zero-subscriber runtime stays valid
      and silent (Constitution C4; ADR-0030 R6/R8).
    artifacts: [backend/app/runtime/event_bus.py]
    tests: [make ci, make unit-m4-recovery]
    promotion: M5.6

  observability:
    title: Observability subscribers
    aliases: [observability, agent_steps, telemetry subscriber, logging subscriber]
    phase: M5.4C
    status: done
    baseline: "630d647"
    depends_on: [event-bus]
    requires: [ADR-0030]
    invariant: >-
      Subscribers map canonical events to agent_steps + structured logs. Business
      never emits (R8). Subscriber failure is non-blocking (R6).
    artifacts:
      - backend/app/runtime/subscribers/agent_steps.py
      - backend/app/runtime/subscribers/logging.py

  lifecycle-instrumentation:
    title: Lifecycle event emission
    aliases: [lifecycle, runcontext, node instrumentation]
    phase: M5.4C
    status: done
    baseline: "630d647"
    depends_on: [event-bus]
    requires: [ADR-0014, ADR-0030]
    invariant: >-
      RunContext flows via LangGraph config (never GraphState). Events are emitted
      at the composition root / node wrappers, never inside Business node bodies.
    artifacts:
      - backend/app/runtime/instrumentation.py

  qualification:
    title: Runtime Qualification
    aliases: [qualify, qualification, benchmark, dogfood, eval]
    phase: M5.5
    status: done
    baseline: "82c3dd3"
    depends_on: [observability, lifecycle-instrumentation]
    gates: [make ci, make unit-m4-recovery, qualify-m5, dogfood-m5]
    benchmarks:           # live, 2026-06-29 (single-sample smoke)
      b_lat_s: 9.89       # conversation turn
      b_ground_s: 6.54    # grounded turn
    artifacts:
      - backend/tests/test_m5_chat_integration.py
      - backend/tests/test_m5_routing_eval.py
      - backend/tests/fixtures/m5_routing_eval.json
      - bin/dogfood-m5-conversation-run.sh

  promotion:
    title: Promotion
    aliases: [promote, promotion, freeze, tag]
    phase: M5.6
    status: done            # promotion docs + freeze + knowledge mirror shipped
    depends_on: [qualification]
    deliverables:
      - docs/m5-promotion.md            # done
      - runtime-contract frozen          # done (Frozen v1)
      - knowledge mirror updated         # done (roadmap, agents/README, graphstate)
      - live dogfood benchmarks          # done (B_lat=9.89s, B_ground=6.54s, 2026-06-29)
    pending_manual:
      - tag m5-complete (awaiting explicit go-ahead)

  # ─────────────────────────────────────────────────────────────────────────
  # M6 — Writing Workspace (Product Plane feature on top of the Runtime Platform)
  #
  # Product Plane (Business) capabilities, governed by the SAME Runtime
  # Constitution (C1–C8) + ADR-0030 (R1–R8) as the Runtime Platform above. They
  # build on the promoted M5 runtime (baseline m5-complete @ bf12c13).
  # ADR-0031/0032/0033 ACCEPTED 2026-06-29 (M6.0, with the four design-review
  # recommendations). `writer-agent` + `chapter-store` are now `ready` (deps done
  # + ADRs accepted); downstream nodes are `planned` until their deps complete.
  #   spec: docs/superpowers/specs/2026-06-29-thesisos-m6-writing-workspace-design.md
  #   plan: plans/m6-writing-workspace-plan.md
  # ─────────────────────────────────────────────────────────────────────────

  writer-agent:
    title: Writer Capability (write_grounded → DraftResult)
    aliases: [writer, writer agent, writer node, writer capability, drafting, draft prose, write_grounded]
    phase: M6.1
    status: done             # writer capability + node (unwired)
    baseline: b8e3b20        # M6.1
    depends_on: [promotion]
    requires: [runtime-constitution, ADR-0030, ADR-0027, ADR-0031]
    invariant: >-
      Writer is a CAPABILITY/port — WriterCapability.write_grounded(brief) -> DraftResult —
      with swappable implementations (writer-v2/fast/reasoning/local) at the composition root,
      no topology change (C8; R1/R2). DraftResult{draft, citations, metadata, reasoning?, metrics}
      is pure: the writer imports no app.db, app.runtime, app.services.chapter, REST, or telemetry
      (R1/R3/R8/C3). make_writer_node is an adapter mapping DraftResult → draft/citations only
      (contracts/agents/writer.json); metadata/reasoning/metrics ride the stream/Event Bus, never
      GraphState. citations.source_id ⊆ retrieved_context (no invented ids). GraphState unchanged.
    artifacts:
      - backend/app/schemas/draft.py
      - backend/app/graph/writer.py
      - backend/app/graph/orchestration/writer_prompt.py
    tests: [writer_capability_unit, draft_result_mapping, writer_isolation, writer_swappable, make ci, make unit-m4-recovery, make qualify-m5]

  writer-route:
    title: Writer route wiring
    aliases: [writer route, drafting route, route writer]
    phase: M6.2
    status: done             # writer route wired (memory_context → retriever → writer → END)
    baseline: 5ad34bf        # M6.2
    depends_on: [writer-agent]
    requires: [ADR-0027, ADR-0031]
    invariant: >-
      Activates the ADR-0027 reserved `writer` route: memory_context → retriever → writer →
      END. conversation/grounded_chat routes byte-for-byte unchanged (C6); retriever_node
      reused unchanged. Writer node instrumented at build_graph (NodeStarted/Completed/Failed,
      phase implement); zero-subscriber runtime stays valid (C4/R6/R8). Additive route vocab only.
    artifacts:
      - backend/app/graph/conversation.py
      - backend/app/graph/routing.py
      - backend/app/graph/orchestration/constants.py
      - backend/app/graph/orchestration/coerce.py
    tests: [writer_route, conditional_routing, existing_routes_unchanged, make ci, make qualify-m5]

  chapter-store:
    title: Chapter store (ChapterService + change stream)
    aliases: [chapter service, workspace service, chapters, chapter versioning, change stream, draft persistence]
    phase: M6.3
    status: done             # ChapterService + chapter_versions change stream + migration 0005
    baseline: 0387929        # M6.3
    depends_on: [promotion]
    requires: [ADR-0015, ADR-0020, ADR-0030, ADR-0032, ADR-0033]
    invariant: >-
      ChapterService is the sole writer for chapters + chapter_versions (ADR-0032; R4).
      Lifecycle draft→review→approved→published (M6 wires draft/review; approved=M9, published=M8).
      Versioning is an append-only CHANGE STREAM: change_kind ∈ {WRITE,EDIT,PROMOTE,MERGE,RESTORE}
      (M6 emits WRITE/EDIT/PROMOTE). Optimistic lock (expected_version → 409). Additive migration
      only (chapters.version + chapter_versions); M0 chapters preserved; schema.sql regenerated.
      No retrieval/embeddings over chapters, no tree ops, no ChapterCreated event (M8).
    artifacts:
      - backend/app/services/chapter/service.py
      - backend/app/schemas/chapter.py
      - backend/app/db/models
      - contracts/db/schema.sql
    tests: [chapter_service_unit, chapter_versioning, optimistic_lock, migration_additive, make ci]

  chapter-api:
    title: Chapters REST API + Workspace UI
    aliases: [chapters api, /chapters, workspace ui]
    phase: M6.4
    status: done             # /chapters REST + Workspace UI
    baseline: 648d563        # M6.4
    depends_on: [chapter-store, writer-route]
    requires: [ADR-0032]
    invariant: >-
      /chapters create/list/get/patch/versions backed only by ChapterService; replaces the 501
      stub. /outline stays 501 (M8). HTTP handler never writes chapters directly. /chat SSE seam
      unchanged.
    artifacts:
      - backend/app/api/chapters.py
      - contracts/openapi/openapi.yaml
      - frontend/app/workspace/
    tests: [chapters_api, openapi_valid, outline_still_stub, conversation_seam, make ci]

  writing-qualification:
    title: Writing Qualification
    aliases: [qualify-m6, writing eval, dogfood-m6]
    phase: M6.5
    status: done             # qualify-m6 (44) + live dogfood-m6
    baseline: 2bd6ba6        # M6.5
    depends_on: [writer-route, chapter-api]
    requires: [ADR-0031, ADR-0032]
    gates: [make ci, make unit-m4-recovery, make qualify-m5, qualify-m6, dogfood-m6]
    benchmarks:           # live, 2026-06-29 (single-sample smoke)
      b_write_s: 63.59    # writer turn: orchestration + retrieval + 6620-char draft
    artifacts:
      - backend/tests/test_m6_writing_integration.py
      - backend/tests/test_m6_writing_eval.py
      - backend/tests/fixtures/m6_writing_eval.json
      - bin/dogfood-m6-writing-run.sh
    tests: [writing_integration, writing_eval, error_contracts, dogfood_writer, dogfood_chapter_save]

  writing-promotion:
    title: Writing Promotion
    aliases: [promote m6, m6 freeze, tag m6]
    phase: M6.6
    status: ready            # deps done (writing-qualification @ 2bd6ba6)
    depends_on: [writing-qualification]
    deliverables:
      - docs/m6-promotion.md
      - runtime-contract §5 writer example (additive)
      - knowledge mirror (roadmap, agents/README, writer-agent, graph.md, graphstate)
      - live dogfood benchmarks (B_write)
    pending_manual:
      - tag m6-complete (awaiting explicit go-ahead)
