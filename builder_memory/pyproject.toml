[project]
name = "thesisos-builder-memory"
version = "0.1.0"
description = "Retrieval-only builder memory sidecar for ThesisOS BuilderOS agents"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
builder-memory = "builder_memory.cli:app"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["builder_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 100
