# ThesisOS docker-compose ingress — UI + API on one origin, SSE unbuffered.
# Listen :80 inside the container; host maps 8080:80.

upstream thesisos_backend {
    server backend:8000;
}

upstream thesisos_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 50m;

    # Browser navigations to /chapters → Writing. API clients send Accept: application/json.
    location = /chapters {
        error_page 418 = @chapters_api;
        if ($http_accept ~* "text/html") {
            return 302 /writing;
        }
        return 418;
    }

    location @chapters_api {
        proxy_pass http://thesisos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser API namespace. Trailing slash on proxy_pass strips the /api/ prefix
    # (/api/writing/actions → /writing/actions). Critical for SSE — no buffering.
    location ^~ /api/ {
        proxy_pass http://thesisos_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never ask upstream to compress SSE/chunked streams (empty body risk).
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Keep chunked encoding on — browsers need it for fetch() ReadableStream SSE.
        chunked_transfer_encoding on;
    }

    # Direct backend paths (same allowlist as frontend/lib/apiProxyPaths.ts)
    location ~ ^/(health|ready|metrics|upload|search|chat|citations|conformance|jobs|projects|documents|memory|chapters|conversations|proposals|export|writing/actions) {
        proxy_pass http://thesisos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Next.js frontend (pages + HMR websocket)
    location / {
        proxy_pass http://thesisos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
